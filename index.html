<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background-color: #000;
            min-height: 100vh;
            padding: 10px;
            border: 1px solid #333;
        }

        /* Header / Navigasi Atas */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            margin-bottom: 10px;
        }
        .logo-box {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #d4af37;
            font-weight: bold;
            font-size: 15px;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }
        .logo-icon {
            color: #d4af37;
            font-size: 18px;
        }
        .btn-livechat {
            background: linear-gradient(180deg, #d4af37, #aa820a);
            color: #000;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* Banner Utama */
        .banner-card {
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            background: radial-gradient(circle, #222 0%, #000 100%);
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .banner-img-box {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
        }
        .banner-img-box img {
            width: 100%;
            display: block;
        }

        /* Menu 5 Tombol Kotak */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }
        .menu-item {
            background: #000;
            border: 1.5px solid #886514;
            border-radius: 8px;
            text-align: center;
            padding: 8px 2px;
            color: #d4af37;
            font-size: 9px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            transition: 0.3s;
        }
        .menu-item:hover {
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
            border-color: #d4af37;
        }
        .menu-icon {
            font-size: 14px;
            margin-bottom: 4px;
        }

        /* Tombol LOGIN & DAFTAR dengan Efek Kilat */
        .auth-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-login {
            flex: 1;
            background: #e50914;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            border-radius: 25px;
            text-decoration: none;
            font-size: 15px;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
            position: relative;
            overflow: hidden;
        }
        .btn-daftar {
            flex: 1;
            background: linear-gradient(180deg, #f7d070, #d4af37);
            color: black;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            border-radius: 25px;
            text-decoration: none;
            font-size: 15px;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.8);
            position: relative;
            overflow: hidden;
        }

        /* Animasi KILAT / Shine pada Tombol */
        .btn-login::after, .btn-daftar::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(30deg);
            animation: flashLight 2.5s infinite;
        }

        @keyframes flashLight {
            0% { left: -60%; }
            20% { left: 120%; }
            100% { left: 120%; }
        }

        /* Daftar Status Bank / Pembayaran */
        .bank-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-bottom: 20px;
        }
        .bank-card {
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            box-shadow: 0 2px 5px rgba(255, 255, 255, 0.1);
        }
        
        /* Indikator Lampu Bulat dengan EFEK KILAT (Glow & Pulse) */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #006400;
            color: white;
            padding: 4px 8px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 12px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #00ff00;
            border-radius: 50%;
            animation: pulseGlow 1.2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                background-color: #00ff00;
                box-shadow: 0 0 2px #00ff00, 0 0 4px #00ff00;
                transform: scale(0.9);
            }
            100% {
                background-color: #55ff55;
                box-shadow: 0 0 8px #00ff00, 0 0 12px #00ff00, 0 0 16px #00ff00;
                transform: scale(1.15);
            }
        }

        /* Gaya Teks Nama Bank */
        .bank-name {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .bca { color: #006699; font-style: italic; }

        .bni { color: #f26522; font-style: italic; }
        .danamon { color: #003399; font-style: italic; }
        .cimb { color: red; font-style: italic; }
        .permata { color: #006633; font-style: italic; }
        .ovo { color: #4c2882; font-style: italic; }
        .gopay { color: #00816a; }
        .dana { color: #0086fb; font-style: italic; }
    </style>
</head>
